<body class="h-full w-full flex bg-surface-container-lowest text-on-surface">
<main class="w-full h-full min-h-screen grid md:grid-cols-2 bg-surface-container-lowest overflow-hidden">
<div class="hidden md:flex flex-col justify-between p-stack-lg bg-primary-container text-on-primary">
<div>
<div class="flex items-center gap-stack-sm mb-stack-lg">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
<h1 class="font-headline-md text-headline-md tracking-tight">EduAttach</h1>
</div>
<h2 class="font-display-lg text-display-lg mb-stack-md leading-tight">Set Your Own Password</h2>
<p class="font-body-lg text-body-lg text-on-primary-container max-w-sm">
                    Your account was created by your coordinator with a temporary password. For security, please set a new password before continuing.
                </p>
</div>
</div>
<div class="p-stack-lg flex flex-col justify-center bg-surface-container-lowest overflow-y-auto">
<div class="w-full max-w-md mx-auto">
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Change Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Enter the temporary password you were given, then choose a new one.</p>

<div id="error-banner" style="display:none;" class="mb-stack-md p-3 rounded-lg bg-error-container text-on-error-container font-body-md text-body-md"></div>

<form class="space-y-stack-md" id="change-password-form">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-base" for="current-password">Current (Temporary) Password <span class="text-error">*</span></label>
<input class="w-full px-3 py-2 border border-outline-variant rounded-DEFAULT focus:ring-1 focus:ring-secondary focus:border-secondary font-body-md text-body-md bg-surface text-on-surface outline-none" id="current-password" required type="password">
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-base" for="new-password">New Password <span class="text-error">*</span></label>
<input class="w-full px-3 py-2 border border-outline-variant rounded-DEFAULT focus:ring-1 focus:ring-secondary focus:border-secondary font-body-md text-body-md bg-surface text-on-surface outline-none" id="new-password" minlength="6" required type="password">
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-base" for="confirm-password">Confirm New Password <span class="text-error">*</span></label>
<input class="w-full px-3 py-2 border border-outline-variant rounded-DEFAULT focus:ring-1 focus:ring-secondary focus:border-secondary font-body-md text-body-md bg-surface text-on-surface outline-none" id="confirm-password" minlength="6" required type="password">
</div>
<div class="pt-stack-sm">
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-secondary hover:bg-secondary-container transition-colors" id="submit-btn" type="submit">
                        Update Password &amp; Continue
                    </button>
</div>
</form>
</div>
</div>
</main>

<script src="js/api.js"></script>
<script>
    const currentUser = getUser();
    if (!currentUser || !getToken()) {
      window.location.href = 'index.html';
    }

    document.getElementById('change-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorBanner = document.getElementById('error-banner');
        errorBanner.style.display = 'none';

        const currentPassword = document.getElementById('current-password').value;
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword !== confirmPassword) {
            errorBanner.textContent = 'New password and confirmation do not match.';
            errorBanner.style.display = 'block';
            return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = 'Updating...';

        try {
            await apiRequest('/auth/change-password', {
                method: 'POST',
                body: { current_password: currentPassword, new_password: newPassword },
            });

            // Update the locally stored user so requireAuth() stops redirecting here
            const user = getUser();
            user.must_change_password = false;
            saveSession(getToken(), user);

            toast('Password updated!');
            window.location.href = roleHomePage(user.role);
        } catch (err) {
            errorBanner.textContent = err.message;
            errorBanner.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Update Password & Continue';
        }
    });
</script>
